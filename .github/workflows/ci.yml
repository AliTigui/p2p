name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-core:
    name: Rust core tests and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace -- --test-threads=1
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  gui-check:
    name: GUI code without display libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p p2p-desktop --features gui
      - run: cargo clippy --locked -p p2p-desktop --features gui --all-targets -- -D warnings

  native-gui:
    name: Native GUI build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev \
            libwayland-dev libxcb1-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev
      - run: cargo build --locked -p p2p-desktop --features native
      - run: cargo clippy --locked -p p2p-desktop --features native --all-targets -- -D warnings
